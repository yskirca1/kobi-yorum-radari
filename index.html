<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReviewRadar</title>
<meta name="description" content="Satmak istediğin ürünün kategorisini ara, müşterilerin en çok neden şikâyet ettiğini gör.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("rr_theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="#/" aria-label="ReviewRadar ana sayfa"><span class="logo-dot" aria-hidden="true"></span>Review<b>Radar</b></a>
    <form class="search" id="search" role="search" autocomplete="off">
      <input id="q" type="search" placeholder="Ne satmak istiyorsun? Örn. termos" aria-label="Kategori ara">
      <button type="submit">Ara</button>
      <ul class="suggest" id="suggest" hidden></ul>
    </form>
    <button type="button" class="theme-btn" id="theme" aria-label="Açık ve koyu tema arasında geçiş yap">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Tema</span>
    </button>
  </div>
</header>
<main id="app" class="wrap"></main>
<div class="cmpbar" id="cmpbar" hidden>
  <div class="cmpbar-in">
    <div class="cmpbar-items" id="cmpbar-items"></div>
    <button type="button" class="btn ghost" id="cmp-clear">Temizle</button>
    <a class="btn" id="cmp-go" href="#/karsilastir">Karşılaştır</a>
  </div>
</div>
<footer class="foot wrap">
  <p>Hamilik Okulu Vakfı pazarlama projesi. Ürün görselleri, puanlar ve yorumlar Trendyol'daki herkese açık ürün sayfalarından alınmıştır. Şikâyet oranları anahtar kelime eşleşmesiyle hesaplanmıştır ve yaklaşıktır.</p>
</footer>
<script src="app.js"></script>
</body>
</html>
